name: Signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "${TAG#v}" != "$version" ]]; then
            echo 'Tag must match the Android versionName (an optional v prefix is accepted).' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo 'prerelease=true' >> "$GITHUB_OUTPUT"; else echo 'prerelease=false' >> "$GITHUB_OUTPUT"; fi
      - name: Test importer
        run: npm ci && npm test
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Missing signing secret: $name" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roguesgallery-release.jks"
      - name: Build signed APK and app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/roguesgallery-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify identity and signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          keytool -exportcert -keystore "$RUNNER_TEMP/roguesgallery-release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/signing.der" >/dev/null 2>&1
          expected="$(openssl x509 -inform DER -in "$RUNNER_TEMP/signing.der" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual="$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt")"
          test "$actual" = "$expected"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='net.chateaulore.roguesgallery'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/bundle-signature.txt"
          mkdir -p release
          cp "$apk" release/RoguesGallery.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/RoguesGallery.aab
          printf '%s\n' "$actual" > release/signing-certificate-sha256.txt
          (cd release && sha256sum RoguesGallery.apk RoguesGallery.aab > SHA256SUMS.txt)
          echo "Verified net.chateaulore.roguesgallery $VERSION; signing certificate SHA-256: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: RoguesGallery-${{ steps.version.outputs.version }}-signed
          path: release/
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/roguesgallery-release.jks" "$RUNNER_TEMP/signing.der"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoguesGallery-${{ needs.build.outputs.version }}-signed
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; keeping its published assets unchanged.'
            exit 0
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" release/* --verify-tag --title "Rogues Gallery $VERSION" --generate-notes "${flags[@]}"
